<title>스킬 라이브러리</title>
<style>
  /* 레이아웃: 상단 고정 검색 바 + 카테고리별 스킬 그리드. 좌측 정렬, 개발자 참조용 대시보드 */
  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --fg: #23221d;
    --muted: #6f6c62;
    --faint: #a8a498;
    --line: #e2e0d8;
    --accent: #b5651d;
    --accent-soft: #f0e3d4;
    --ns: #4a6b6f;
    --radius: 10px;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1916;
      --surface: #23221e;
      --fg: #eceae2;
      --muted: #a39f93;
      --faint: #6b6859;
      --line: #322f29;
      --accent: #e0914a;
      --accent-soft: #3a2e1f;
      --ns: #7fa6ab;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1916;
    --surface: #23221e;
    --fg: #eceae2;
    --muted: #a39f93;
    --faint: #6b6859;
    --line: #322f29;
    --accent: #e0914a;
    --accent-soft: #3a2e1f;
    --ns: #7fa6ab;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.5;
    margin: 0;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding-inline: 20px; }

  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding-block: 16px;
  }
  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 {
    font-size: 1.5rem; font-weight: 600; margin: 0; letter-spacing: -0.01em;
    text-wrap: balance;
  }
  h1 .dot { color: var(--accent); }
  .tally { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .tally b { color: var(--fg); font-weight: 600; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #q {
    flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 0.9rem;
    padding: 9px 13px;
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  #q::placeholder { color: var(--faint); }
  .count-live { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

  main { padding-block: 24px 60px; }
  section.cat { margin-bottom: 34px; scroll-margin-top: 140px; }
  .cat-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
  .cat-head h2 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .cat-head .ns { font-family: var(--mono); font-size: 0.72rem; color: var(--ns); padding: 2px 7px; border: 1px solid var(--line); border-radius: 20px; }
  .cat-head .cnt { font-family: var(--mono); font-size: 0.75rem; color: var(--faint); margin-left: auto; }
  .cat-note { font-size: 0.82rem; color: var(--muted); margin: 8px 0 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .skill {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 11px 13px;
  }
  .skill .name { font-family: var(--mono); font-size: 0.86rem; font-weight: 500; color: var(--fg); word-break: break-word; }
  .skill .name .slash { color: var(--accent); }
  .skill .desc { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }

  .empty { color: var(--faint); font-family: var(--mono); font-size: 0.85rem; padding: 40px 0; text-align: center; display: none; }

  footer { border-top: 1px solid var(--line); padding-block: 18px; font-size: 0.76rem; color: var(--faint); }
  footer code { font-family: var(--mono); color: var(--muted); }

  mark { background: var(--accent-soft); color: var(--fg); border-radius: 3px; padding: 0 1px; }
  @media (max-width: 440px) {
    .wrap { padding-inline: 16px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

      <span class="count-live" id="shown"></span>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="root"></div>
    <p class="empty" id="empty">일치하는 스킬이 없습니다.</p>
  </div>
</main>

<footer>

  const root = document.getElementById("root");
  let total = 0;
  DATA.forEach((c, ci) => {
    total += c.items.length;
    const sec = document.createElement("section");
    sec.className = "cat";
    sec.dataset.cat = c.cat + " " + c.ns;
    const nsTag = c.ns && c.ns !== "—" ? `<span class="ns">${c.ns}</span>` : "";
    sec.innerHTML = `
      <div class="cat-head">
        <h2>${c.cat}</h2>${nsTag}
        <span class="cnt">${c.items.length}</span>
      </div>
      ${c.note ? `<p class="cat-note">${c.note}</p>` : ""}
      <div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    c.items.forEach(([name, desc]) => {
      const el = document.createElement("div");
      el.className = "skill";
      el.dataset.search = (name + " " + desc + " " + c.cat + " " + c.ns).toLowerCase();
      el.dataset.name = name;
      el.dataset.desc = desc;
      el.innerHTML = `<div class="name"><span class="slash">/</span><span class="nm">${name}</span></div><div class="desc">${desc}</div>`;
      grid.appendChild(el);
    });
    root.appendChild(sec);
  });

  document.getElementById("total").textContent = total;
  document.getElementById("catcount").textContent = DATA.length;

  const q = document.getElementById("q");
  const shown = document.getElementById("shown");
  const empty = document.getElementById("empty");

  function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function hl(el, term){
    const nm = el.dataset.name, ds = el.dataset.desc;
    if(!term){ el.querySelector(".nm").textContent = nm; el.querySelector(".desc").textContent = ds; return; }
    const re = new RegExp("("+esc(term)+")","ig");
    el.querySelector(".nm").innerHTML = nm.replace(re,"<mark>$1</mark>");
    el.querySelector(".desc").innerHTML = ds.replace(re,"<mark>$1</mark>");
  }

  function filter(){
    const term = q.value.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll("section.cat").forEach(sec => {
      let secVis = 0;
      sec.querySelectorAll(".skill").forEach(el => {
        const match = !term || el.dataset.search.includes(term);
        el.hidden = !match;
        if(match){ secVis++; visible++; hl(el, term); }
      });
      sec.hidden = secVis === 0;
    });
    empty.style.display = visible === 0 ? "block" : "none";
    shown.textContent = term ? `${visible}개 표시` : "";
  }
  q.addEventListener("input", filter);
</script>
